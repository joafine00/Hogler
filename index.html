<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogler Translator</title>
<style>
body { font-family:'Courier New',monospace; background:#0e0e0e; color:#f0f0f0; margin:0; padding:0; }
header { background:#222; padding:10px 20px; color:#ffcc00; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 6px rgba(0,0,0,0.5);}
header h1 { margin:0; font-size:1.8em; }
nav a { color:#ffcc00; text-decoration:none; margin-left:15px; font-weight:bold; transition:0.3s;}
nav a:hover { color:#fff; }
.container { padding:20px; }
textarea { width:100%; height:100px; background:#1a1a1a; color:#f0f0f0; border:2px solid #444; border-radius:8px; padding:10px; font-size:16px; font-family:monospace; }
button { margin:10px 5px 10px 0; padding:10px 20px; font-size:16px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
#translateBtn { background-color:#ffcc00; } #listenBtn { background-color:#33cc33; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { padding:10px; border:1px solid #555; text-align:left; }
th { background:#333; color:#ffcc00; } td { background:#222; }
footer { text-align:center; padding:15px; color:#ffcc00; margin-top:20px; border-top:1px solid #444; }
</style>
</head>
<body>

<header>
<h1>Hogler Translator</h1>
<nav>
  <a href="https://dsc.gg/ispasyu" target="_blank">Discord</a>
</nav>
</header>

<div class="container">
<textarea id="inputText" placeholder="Digite seu texto aqui..."></textarea><br>
<button id="translateBtn" onclick="translateHogler()">Traduzir</button>
<button id="listenBtn" onclick="listenHogler()">Ouvir</button>

<table id="outputTable">
<thead>
<tr>
<th>Palavra</th>
<th>Hogler (Pronúncia)</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<footer>Made In Portugal</footer>

<script>
// Símbolos Hogler
const hoglerSymbols = {'A':'ㅁ','B':'ㄴ','C':'ㅇ','D':'ㄹ','E':'ㅎ','F':'ㅂ','G':'ㅅ','H':'ㅈ','I':'ㅌ','J':'ㄱ','K':'ㅋ','L':'ㅍ','M':'ㅠ','N':'ㅛ','O':'ㅑ','P':'ㅕ','Q':'ㅏ','R':'ㅣ','S':'ㅡ','T':'ㅗ','U':'ㅓ','V':'ㅐ','W':'ㅔ','X':'ㅂ','Y':'ㅊ','Z':'ㅌ','Ç':'ㄱ'};

// Palavras especiais
const specialWords = {
"oi": {symbols:"ㅇㅔ",pronunciation:"Au"},
"olá": {symbols:"ㅇㅔ",pronunciation:"Au"},
"nome": {symbols:"ㅁㅣ",pronunciation:"No"},
"idade": {symbols:"ㅎㅣ",pronunciation:"Ida"},
"país": {symbols:"ㅁㅓ",pronunciation:"Pais"},
"cidade": {symbols:"ㅅㅓ",pronunciation:"Cida"}
};

// Normalização e cifra
function normalizeWord(word){ return word.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function caesarShift(char){ const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZÇ"; let upper=char.toUpperCase(); if(alphabet.includes(upper)) return alphabet[(alphabet.indexOf(upper)+2)%alphabet.length]; return char; }
function findExpression(text){ let normalized=normalizeWord(text).toLowerCase(); for(let key of Object.keys(specialWords).sort((a,b)=>b.length-a.length)){ if(normalizeWord(key)===normalized) return key;} return null; }

// Converter palavra para Hogler
function wordToHogler(word){
  let expr=findExpression(word);
  if(expr) return specialWords[expr].symbols;
  let normalized=normalizeWord(word);
  let shifted=''; for(let c of normalized) shifted+=caesarShift(c);
  let symbols=''; for(let c of shifted){ let u=c.toUpperCase(); symbols+=hoglerSymbols[u]||c; }
  return symbols;
}

// Pronúncia frase inteira
function wordPronunciation(text){
  let words=text.split(/\s+/);
  let result=[];
  words.forEach(word => {
    let expr=findExpression(word);
    if(expr) result.push(specialWords[expr].pronunciation);
    else { let normalized=normalizeWord(word); let shifted=''; for(let c of normalized) shifted+=caesarShift(c); result.push(shifted);}
  });
  return result.join(' ');
}

// Traduzir frase
function translateHogler(){
  const input=document.getElementById('inputText').value;
  const tbody=document.querySelector('#outputTable tbody');
  tbody.innerHTML='';
  const words=input.match(/\S+/g)||[];
  words.forEach(word=>{
    const symbols=wordToHogler(word);
    const pron=wordPronunciation(word);
    const row=`<tr><td>${word}</td><td>${symbols} (${pron})</td></tr>`;
    tbody.innerHTML+=row;
  });
}

// Ouvir frase inteira
function listenHogler(){
  const input=document.getElementById('inputText').value;
  const utterance=new SpeechSynthesisUtterance(wordPronunciation(input));
  utterance.lang='pt-BR';
  window.speechSynthesis.speak(utterance);
}
</script>

</body>
</html>
