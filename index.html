<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogler Learning</title>
<style>
body {
  font-family: 'Courier New', monospace;
  background: #0e0e0e;
  color: #f0f0f0;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}
header {
  background: #222;
  padding: 15px 20px;
  color: #ffcc00;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 6px rgba(0,0,0,0.5);
}
header h1 { margin: 0; font-size: 2em; }
nav a {
  color: #ffcc00;
  text-decoration: none;
  margin-left: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
nav a.active, nav a:hover { color: #fff; }
.container {
  padding: 20px;
  display: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.container.active {
  display: block;
  opacity: 1;
}
button {
  margin: 10px 5px 10px 0;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s ease;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px #ffcc00;
}
#translateBtn { background: #ffcc00; color: #000; }
#listenBtn { background: #33cc33; color: #000; }
#hudBtn { background: #00ccff; color: #000; }
textarea {
  width: 100%;
  height: 100px;
  background: #1a1a1a;
  color: #f0f0f0;
  border: 2px solid #444;
  border-radius: 8px;
  padding: 10px;
  font-size: 16px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
th, td {
  padding: 10px;
  border: 1px solid #555;
  text-align: left;
}
th { background: #333; color: #ffcc00; }
td { background: #222; }
/* HUD */
#dictionaryHUD {
  position: fixed;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 800px;
  background: #111;
  border: 2px solid #ffcc00;
  border-radius: 12px;
  padding: 20px;
  display: none;
  z-index: 1000;
  box-shadow: 0 8px 16px rgba(0,0,0,0.8);
  animation: fadeIn 0.5s ease;
}
#closeHUD {
  background: #ff3333;
  float: right;
  padding: 5px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
#closeHUD:hover { background: #cc0000; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
/* Texto animado */
.animatedText {
  animation: textFade 2s ease forwards;
}
@keyframes textFade {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity:1; transform: translateY(0);}
}
footer { text-align:center; padding:15px; color:#ffcc00; margin-top:20px; border-top:1px solid #444; }
</style>
</head>
<body>

<header>
<h1>Hogler Learning</h1>
<nav>
<a class="tablink active" onclick="openTab(event,'Tradutor')">Tradutor</a>
<a class="tablink" onclick="openTab(event,'Dicionario')">Dicionário</a>
<a class="tablink" onclick="openTab(event,'Sobre')">Sobre</a>
</nav>
</header>

<!-- Tradutor -->
<div id="Tradutor" class="container active">
<p class="animatedText">Escolha o tipo de Hogler que deseja aprender:</p>
<select id="typeSelect">
  <option value="tradicional">Hogler Tradicional (Português)</option>
  <option value="normal">Hogler Normal (Alemão)</option>
</select>
<textarea id="inputText" placeholder="Digite seu texto aqui..."></textarea><br>
<button id="translateBtn" onclick="translateHogler()">Traduzir</button>
<button id="listenBtn" onclick="listenHogler()">Ouvir</button>

<table id="outputTable">
<thead>
<tr>
<th>Palavra</th>
<th>Hogler (Pronúncia)</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- Dicionário -->
<div id="Dicionario" class="container">
<h2 class="animatedText">Dicionário Hogler</h2>
<button id="hudBtn" onclick="toggleHUD()">Abrir HUD Detalhado</button>
<div id="dictionaryHUD">
<button id="closeHUD" onclick="toggleHUD()">Fechar</button>
<h2>Vocabulário e Regras</h2>
<ul id="dictList"></ul>
</div>
</div>

<!-- Sobre -->
<div id="Sobre" class="container">
<h2 class="animatedText">Sobre</h2>
<p><a href="https://dsc.gg/ispasyu" target="_blank">Discord</a></p>
<p>Made in Portugal</p>
</div>

<script>
// Função de abas animada
function openTab(evt, tabName){
  document.querySelectorAll('.container').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.tablink').forEach(l=>l.classList.remove('active'));
  document.getElementById(tabName).classList.add('active');
  evt.currentTarget.classList.add('active');
}

// HUD
function toggleHUD(){
  const hud=document.getElementById('dictionaryHUD');
  hud.style.display=(hud.style.display==='block')?'none':'block';
}

// Palavras especiais
const portugueseWords = {
"oi": {symbols:"ㅇㅔ",pronunciation:"Au"},
"olá": {symbols:"ㅇㅔ",pronunciation:"Au"},
"nome": {symbols:"ㅁㅣ",pronunciation:"No"},
"idade": {symbols:"ㅎㅣ",pronunciation:"Ida"},
"país": {symbols:"ㅁㅓ",pronunciation:"Pais"}
};
const germanWords = {
"hallo": {symbols:"ㅎㅏ",pronunciation:"Hallo"},
"welt": {symbols:"ㅗㅔ",pronunciation:"Welt"}
};
const hoglerSymbols = {'A':'ㅁ','B':'ㄴ','C':'ㅇ','D':'ㄹ','E':'ㅎ','F':'ㅂ','G':'ㅅ','H':'ㅈ','I':'ㅌ','J':'ㄱ','K':'ㅋ','L':'ㅍ','M':'ㅠ','N':'ㅛ','O':'ㅑ','P':'ㅕ','Q':'ㅏ','R':'ㅣ','S':'ㅡ','T':'ㅗ','U':'ㅓ','V':'ㅐ','W':'ㅔ','X':'ㅂ','Y':'ㅊ','Z':'ㅌ','Ä':'ㅁ','Ö':'ㅑ','Ü':'ㅓ','ß':'ㅅ','Ç':'ㄱ'};

// Normalização e cifragem
function normalizeWord(word){ return word.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function caesarShift(char, alphabet){ let upper=char.toUpperCase(); if(alphabet.includes(upper)) return alphabet[(alphabet.indexOf(upper)+2)%alphabet.length]; return char; }

// Tradutor
function wordToHogler(word,type){
  let dict=(type==="tradicional")?portugueseWords:germanWords;
  let expr=dict[word.toLowerCase()];
  if(expr) return expr.symbols;
  let alphabet=(type==="tradicional")?"ABCDEFGHIJKLMNOPQRSTUVWXYZÇ":"AÄBCDEFGHIJKLMNOPQRSTUVWXYZÖÜß";
  let shifted=''; for(let c of word) shifted+=caesarShift(c,alphabet);
  let symbols=''; for(let c of shifted){ symbols+=hoglerSymbols[c.toUpperCase()]||c;}
  return symbols;
}
function wordPronunciation(text,type){
  let dict=(type==="tradicional")?portugueseWords:germanWords;
  let words=text.split(/\s+/); let result=[];
  words.forEach(word=>{ let expr=dict[word.toLowerCase()]; if(expr) result.push(expr.pronunciation); else { let alphabet=(type==="tradicional")?"ABCDEFGHIJKLMNOPQRSTUVWXYZÇ":"AÄBCDEFGHIJKLMNOPQRSTUVWXYZÖÜß"; let shifted=''; for(let c of word) shifted+=caesarShift(c,alphabet); result.push(shifted); }});
  return result.join(' ');
}
function translateHogler(){
  const input=document.getElementById('inputText').value;
  const type=document.getElementById('typeSelect').value;
  const tbody=document.querySelector('#outputTable tbody');
  tbody.innerHTML='';
  const words=input.match(/\S+/g)||[];
  words.forEach(word=>{
    const symbols=wordToHogler(word,type);
    const pron=wordPronunciation(word,type);
    const row=`<tr><td>${word}</td><td>${symbols} (${pron})</td></tr>`;
    tbody.innerHTML+=row;
  });
}
function listenHogler(){
  const input=document.getElementById('inputText').value;
  const type=document.getElementById('typeSelect').value;
  const utterance=new SpeechSynthesisUtterance(wordPronunciation(input,type));
  utterance.lang=(type==="tradicional")?'pt-BR':'de-DE';
  window.speechSynthesis.speak(utterance);
}

// HUD Dicionário
function updateDictionary(){
  const dictList=document.getElementById('dictList');
  dictList.innerHTML='';
  const combined={...portugueseWords,...germanWords};
  for(const [k,v] of Object.entries(combined)){
    dictList.innerHTML+=`<li><strong>${k}</strong> → Símbolos: ${v.symbols}, Pronúncia: ${v.pronunciation}</li>`;
  }
}
updateDictionary();
</script>

<footer>Made in Portugal</footer>
