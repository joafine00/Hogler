<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogler Learning</title>
<style>
body {
  font-family: 'Courier New', monospace;
  background: #0e0e0e;
  color: #f0f0f0;
  margin: 0;
  padding: 0;
}
header {
  background: #222;
  padding: 15px 20px;
  color: #ffcc00;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 { margin: 0; font-size: 2em; }
nav a {
  color: #ffcc00;
  text-decoration: none;
  margin-left: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
nav a.active, nav a:hover { color: #fff; }
.container { padding: 20px; display: none; opacity: 0; transition: opacity 0.6s ease; }
.container.active { display: block; opacity: 1; }
button {
  margin: 10px 5px 10px 0;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s ease;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px #ffcc00;
}
#translateBtn { background: #ffcc00; color: #000; }
#swapBtn { background: #ff6600; color: #000; }
#listenBtn { background: #33cc33; color: #000; }
textarea {
  width: 100%;
  height: 100px;
  background: #1a1a1a;
  color: #f0f0f0;
  border: 2px solid #444;
  border-radius: 8px;
  padding: 10px;
  font-size: 16px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
th, td {
  padding: 10px;
  border: 1px solid #555;
  text-align: left;
}
th { background: #333; color: #ffcc00; }
td { background: #222; }
footer { text-align:center; padding:15px; color:#ffcc00; margin-top:20px; border-top:1px solid #444; }
</style>
</head>
<body>

<header>
  <h1>Hogler Learning</h1>
  <nav>
    <a class="tablink active" onclick="openTab(event,'Tradutor')">Tradutor</a>
    <a class="tablink" onclick="openTab(event,'Dicionario')">Dicionário</a>
    <a class="tablink" onclick="openTab(event,'Sobre')">Sobre</a>
  </nav>
</header>

<!-- Tradutor -->
<div id="Tradutor" class="container active">
  <p>Selecione os idiomas:</p>
  <select id="fromLang">
    <option value="pt">Português</option>
    <option value="de">Alemão</option>
    <option value="hogler">Hogler</option>
  </select>
  <button id="swapBtn" onclick="swapLanguages()">🔄 Inverter</button>
  <select id="toLang">
    <option value="hogler">Hogler</option>
    <option value="pt">Português</option>
    <option value="de">Alemão</option>
  </select>

  <textarea id="inputText" placeholder="Digite seu texto aqui..."></textarea><br>
  <button id="translateBtn" onclick="translateHogler()">Traduzir</button>
  <button id="listenBtn" onclick="listenHogler()">Ouvir</button>

  <table id="outputTable">
    <thead>
      <tr>
        <th>Texto</th>
        <th>Tradução</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Dicionário -->
<div id="Dicionario" class="container">
  <h2>Dicionário Hogler</h2>
  <ul id="dictList"></ul>
</div>

<!-- Sobre -->
<div id="Sobre" class="container">
  <h2>Sobre</h2>
  <p><a href="https://dsc.gg/ispasyu" target="_blank">Discord</a></p>
  <p>Made in Portugal</p>
</div>

<script>
// Função de abas
function openTab(evt, tabName){
  document.querySelectorAll('.container').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.tablink').forEach(l=>l.classList.remove('active'));
  document.getElementById(tabName).classList.add('active');
  evt.currentTarget.classList.add('active');
}

// Vocabulário
const portugueseWords = {
  "oi": {symbols:"ㅇㅔ",pronunciation:"Au"},
  "olá": {symbols:"ㅇㅔ",pronunciation:"Au"},
  "nome": {symbols:"ㅁㅣ",pronunciation:"No"},
  "idade": {symbols:"ㅎㅣ",pronunciation:"Ida"},
  "país": {symbols:"ㅁㅓ",pronunciation:"Pais"}
};
const germanWords = {
  "hallo": {symbols:"ㅎㅏ",pronunciation:"Hallo"},
  "welt": {symbols:"ㅗㅔ",pronunciation:"Welt"}
};
const hoglerSymbols = {'A':'ㅁ','B':'ㄴ','C':'ㅇ','D':'ㄹ','E':'ㅎ','F':'ㅂ','G':'ㅅ','H':'ㅈ','I':'ㅌ','J':'ㄱ','K':'ㅋ','L':'ㅍ','M':'ㅠ','N':'ㅛ','O':'ㅑ','P':'ㅕ','Q':'ㅏ','R':'ㅣ','S':'ㅡ','T':'ㅗ','U':'ㅓ','V':'ㅐ','W':'ㅔ','X':'ㅂ','Y':'ㅊ','Z':'ㅌ','Ç':'ㄱ'};

// Normalização e cifra
function normalizeWord(word){ return word.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function caesarShift(char, alphabet){ let upper=char.toUpperCase(); if(alphabet.includes(upper)) return alphabet[(alphabet.indexOf(upper)+2)%alphabet.length]; return char; }

// Conversão
function toHogler(word, lang){
  const dict = (lang==="pt")?portugueseWords:germanWords;
  const found = dict[word.toLowerCase()];
  if(found) return found.symbols;
  let alphabet = (lang==="pt")?"ABCDEFGHIJKLMNOPQRSTUVWXYZÇ":"AÄBCDEFGHIJKLMNOPQRSTUVWXYZÖÜß";
  let shifted=''; for(let c of word) shifted+=caesarShift(c,alphabet);
  let symbols=''; for(let c of shifted){ symbols+=hoglerSymbols[c.toUpperCase()]||c;}
  return symbols;
}
function fromHogler(word, lang){
  const dict = (lang==="pt")?portugueseWords:germanWords;
  for(let [k,v] of Object.entries(dict)){
    if(v.symbols===word) return k;
  }
  return "(desconhecido)";
}

// Tradução principal
function translateHogler(){
  const from=document.getElementById('fromLang').value;
  const to=document.getElementById('toLang').value;
  const input=document.getElementById('inputText').value.trim();
  const tbody=document.querySelector('#outputTable tbody');
  tbody.innerHTML='';

  if(!input) return;

  const words=input.split(/\s+/);
  words.forEach(word=>{
    let translated="";
    if(from!=="hogler" && to==="hogler"){
      translated=toHogler(word,from);
    } else if(from==="hogler" && to!=="hogler"){
      translated=fromHogler(word,to);
    } else if(from!==to){
      // via Hogler
      let temp=toHogler(word,from);
      translated=fromHogler(temp,to);
    } else {
      translated=word;
    }
    tbody.innerHTML+=`<tr><td>${word}</td><td>${translated}</td></tr>`;
  });
}

// Botão de inverter idiomas
function swapLanguages(){
  const from=document.getElementById('fromLang');
  const to=document.getElementById('toLang');
  const temp=from.value;
  from.value=to.value;
  to.value=temp;
}

// ----------- IA DE VOZ (GOOGLE DEUTSCH) -----------
let availableVoices = [];
window.speechSynthesis.onvoiceschanged = () => {
  availableVoices = window.speechSynthesis.getVoices();
  console.log("Vozes carregadas:", availableVoices.map(v=>v.name));
};

function listenHogler(){
  const outputTable=document.querySelector('#outputTable tbody');
  if(!outputTable.innerText.trim()) return;

  const text=Array.from(outputTable.querySelectorAll('td:nth-child(2)'))
    .map(td=>td.innerText)
    .join(' ');

  const utterance=new SpeechSynthesisUtterance(text);

  // Procurar voz do Google em alemão
  let germanVoice = availableVoices.find(v =>
    v.name.toLowerCase().includes("google deutsch") ||
    v.lang === "de-DE"
  );

  if (!germanVoice && availableVoices.length > 0) germanVoice = availableVoices[0];

  utterance.voice = germanVoice;
  utterance.lang = "de-DE"; // força alemão (mais fluido)
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}
// ---------------------------------------------------

// Atualiza dicionário
function updateDictionary(){
  const dictList=document.getElementById('dictList');
  dictList.innerHTML='';
  const combined={...portugueseWords,...germanWords};
  for(const [k,v] of Object.entries(combined)){
    dictList.innerHTML+=`<li><strong>${k}</strong> → ${v.symbols} (${v.pronunciation})</li>`;
  }
}
updateDictionary();
</script>

<footer>Made in Portugal</footer>
</body>
</html>
